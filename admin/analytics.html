<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Analytics | Dr. Sandesh Mahesh</title><link rel="stylesheet" href="../css/main.css"></head>
<body><section><div class="wrap"><h1>Analytics</h1><p class="note">Anonymous Reels UTM traffic, check-in completions, and consultation clicks for Dr. Sandesh Mahesh.</p><p id="msg" class="note"></p><div id="out"></div></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="../js/supabase-config.js"></script><script src="../js/ui.js"></script><script src="../js/admin-auth.js"></script>
<script>(async function(){var sb=await adminReady;if(!sb)return;var msg=document.getElementById('msg'),out=document.getElementById('out');
var r=await sb.from('analytics_events').select('event_type,utm_campaign,utm_source,path,created_at').eq('doctor_id',SUPABASE_CONFIG.doctorId).order('created_at',{ascending:false}).limit(2000);
if(r.error){msg.textContent='Could not load analytics.';return;}
var m={};r.data.forEach(function(x){m[x.event_type]=(m[x.event_type]||0)+1;});
out.appendChild(el('pre',{text:JSON.stringify(m,null,2)}));})();</script></body></html>
